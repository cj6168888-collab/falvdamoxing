name: legal-ai

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${BACKEND_IMAGE:-legal-ai-assistant:latest}
    restart: always
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./.env.prod:/app/.env:ro
    env_file:
      - .env.prod
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - LOG_LEVEL=INFO
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - legal-network

  migrate:
    image: ${BACKEND_IMAGE:-legal-ai-assistant:latest}
    container_name: legal-ai-migrate
    command: python -m app.db.migrate_all
    env_file:
      - .env.prod
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - AUTO_CREATE_TABLES=1
      - DATABASE_URL=${MIGRATION_DATABASE_URL}
    volumes:
      - ./data:/app/data
      - ./.env.prod:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal-network
    profiles:
      - migrate

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: legal-ai-frontend:latest
    restart: always
    expose:
      - "8501"
    depends_on:
      - app
    networks:
      - legal-network

  postgres:
    image: postgres:15-alpine
    container_name: legal-postgres-prod
    restart: always
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - legal-network

  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    image: legal-ai-pgbouncer:latest
    container_name: legal-pgbouncer-prod
    restart: always
    env_file:
      - .env.prod
    expose:
      - "6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" pg_isready -h 127.0.0.1 -p 6432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legal-network

  redis:
    image: redis:7-alpine
    container_name: legal-redis-prod
    restart: always
    command: ["sh", "-c", "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\""]
    env_file:
      - .env.prod
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-network

  nginx:
    image: nginx:alpine
    container_name: legal-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
      - frontend
    networks:
      - legal-network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        INSTALL_WORKER: "true"
    image: ${WORKER_IMAGE:-legal-ai-assistant-worker:latest}
    container_name: legal-celery-prod
    restart: always
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env.prod
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal-network
    profiles:
      - celery

networks:
  legal-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
