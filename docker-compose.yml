name: legalai

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: legal-ai-assistant
    container_name: legal-ai-assistant
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./.env.legal:/app/.env.legal:ro
    env_file:
      - .env.legal
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
