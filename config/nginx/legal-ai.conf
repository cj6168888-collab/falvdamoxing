# 法律大模型 Nginx 配置
# 此文件挂载到 legal-ai-nginx 容器内
# 外部 nginx 将 fl.jilinpc.com 反代到 127.0.0.1:8088

server {
    listen 80;
    server_name fl.jilinpc.com localhost;

    # 上传限制 50MB
    client_max_body_size 50m;

    # API 后端
    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 文档
    location /docs {
        proxy_pass http://app:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://app:8000/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://app:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 健康检查
    location /health {
        proxy_pass http://app:8000/health;
        proxy_set_header Host $host;
    }

    # 前端静态文件 (如果构建了前端)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # SSE 流式
    location /api/streaming-analysis/ {
        proxy_pass http://app:8000/api/streaming-analysis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
