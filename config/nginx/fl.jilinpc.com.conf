# ============================================================
# 法律大模型 - Nginx 站点配置 (fl.jilinpc.com)
# 上传到服务器 /etc/nginx/conf.d/fl.jilinpc.com.conf
# 然后执行: nginx -t && nginx -s reload
# ============================================================
server {
    listen 80;
    server_name fl.jilinpc.com;

    # 上传限制 50MB
    client_max_body_size 50m;

    # API 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8089/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 文档
    location /docs {
        proxy_pass http://127.0.0.1:8089/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8089/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8089/openapi.json;
        proxy_set_header Host $host;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8089/health;
        proxy_set_header Host $host;
    }

    # SSE 流式 (AI分析)
    location /api/streaming-analysis/ {
        proxy_pass http://127.0.0.1:8089/api/streaming-analysis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 前端静态文件 (如果构建)
    location / {
        proxy_pass http://127.0.0.1:8089/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
