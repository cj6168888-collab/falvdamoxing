# ============================================================
# 法律大模型 - 生产部署 (fl.jilinpc.com)
# 独立容器名/端口，不干扰 数字员工(jilin) 和 睡了么(shuileme)
# ============================================================
name: legal-ai

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: legal-ai-assistant:latest
    container_name: legal-ai-app
    restart: always
    ports:
      - "127.0.0.1:8089:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.fl-prod
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-legal_ai_pg_2026}@legal-ai-pg:5432/legal_ai
      - REDIS_URL=redis://:${REDIS_PASSWORD:-legal_ai_redis_2026}@legal-ai-redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-legal_ai_redis_2026}@legal-ai-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-legal_ai_redis_2026}@legal-ai-redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - legal-ai-net

  postgres:
    image: postgres:15-alpine
    container_name: legal-ai-pg
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_ai_pg_2026}
      POSTGRES_DB: legal_ai
    volumes:
      - legal_ai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai-net

  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-legal_ai_redis_2026} --port 6379
    volumes:
      - legal_ai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-legal_ai_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-ai-net

  sms-gateway:
    image: python:3.10-alpine
    container_name: legal-ai-sms
    restart: always
    working_dir: /app
    command: python /app/scripts/aliyun_sms_gateway.py --host 0.0.0.0 --port 8090
    volumes:
      - ./scripts/aliyun_sms_gateway.py:/app/scripts/aliyun_sms_gateway.py:ro
    environment:
      - ALIYUN_SMS_ACCESS_KEY_ID=${ALIYUN_SMS_ACCESS_KEY_ID}
      - ALIYUN_SMS_ACCESS_KEY_SECRET=${ALIYUN_SMS_ACCESS_KEY_SECRET}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-吉麟}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE:-SMS_506390507}
      - ALIYUN_SMS_REGION_ID=${ALIYUN_SMS_REGION_ID:-cn-hangzhou}
      - ALIYUN_SMS_TEMPLATE_PARAM_NAME=${ALIYUN_SMS_TEMPLATE_PARAM_KEY:-code}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-net

networks:
  legal-ai-net:
    driver: bridge

volumes:
  legal_ai_pg:
    driver: local
  legal_ai_redis:
    driver: local
