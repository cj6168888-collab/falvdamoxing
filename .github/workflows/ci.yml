name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ============================================================
  # 1. 代码质量检查
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-core.txt', 'requirements-optional.txt', 'requirements-worker.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: |
          pip install ruff black mypy isort

      - name: Check code format (black)
        run: |
          black --check app/ ui/ --extend-exclude 'ui/pages/'

      - name: Check imports (isort)
        run: |
          isort --check-only app/ ui/ --extend-skip-glob 'ui/pages/*'

      - name: Lint (ruff)
        run: |
          ruff check app/ --ignore E501,F401

  # ============================================================
  # 2. 语法与类型检查
  # ============================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements-core.txt mypy types-requests types-PyYAML

      - name: Type check (mypy)
        run: |
          mypy app/services/llm_service.py \
               app/services/evidence_service.py \
               app/services/qa_service.py \
               app/services/timeline_service.py \
               --ignore-missing-imports --no-error-summary || true

  # ============================================================
  # 3. 后端单元测试
  # ============================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: legal_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements-core.txt pytest pytest-asyncio \
            httpx pytest-cov

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/legal_test
          DASHSCOPE_API_KEY: test_key
          CHROMA_PERSIST_DIRECTORY: /tmp/chroma_test
        run: |
          pytest tests/ -m "not optional" -v --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # 4. 前端语法检查
  # ============================================================
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Type check
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: |
          npm test

      - name: Build
        working-directory: frontend
        run: |
          npm run build

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml --profile celery config --services

      - name: Build default backend image
        run: |
          docker build -f Dockerfile.prod -t legal-ai-backend:ci .

      - name: Run default image migration
        run: |
          docker volume create legal-ai-smoke-data
          docker run --rm \
            -v legal-ai-smoke-data:/tmp/smoke \
            -e APP_ENV=production \
            -e AUTO_CREATE_TABLES=0 \
            -e JWT_SECRET=test-secret \
            -e SECRET_KEY=test-session-secret \
            -e CORS_ORIGINS=https://ci.example.test \
            -e DATABASE_URL=sqlite:////tmp/smoke/legal_smoke.db \
            -e CHROMA_PERSIST_DIRECTORY=/tmp/chroma \
            -e FILE_STORAGE_PATH=/tmp/files \
            legal-ai-backend:ci python -m app.db.migrate_all
          docker run --rm \
            -v legal-ai-smoke-data:/tmp/smoke \
            -e APP_ENV=production \
            -e AUTO_CREATE_TABLES=0 \
            -e JWT_SECRET=test-secret \
            -e SECRET_KEY=test-session-secret \
            -e CORS_ORIGINS=https://ci.example.test \
            -e DATABASE_URL=sqlite:////tmp/smoke/legal_smoke.db \
            -e CHROMA_PERSIST_DIRECTORY=/tmp/chroma \
            -e FILE_STORAGE_PATH=/tmp/files \
            legal-ai-backend:ci python -m app.db.migrate_all --check

      - name: Smoke default backend image
        run: |
          docker run -d --name legal-ai-backend-ci -p 8011:8000 \
            -v legal-ai-smoke-data:/tmp/smoke \
            -e APP_ENV=production \
            -e AUTO_CREATE_TABLES=0 \
            -e JWT_SECRET=test-secret \
            -e SECRET_KEY=test-session-secret \
            -e CORS_ORIGINS=https://ci.example.test \
            -e DATABASE_URL=sqlite:////tmp/smoke/legal_smoke.db \
            -e CHROMA_PERSIST_DIRECTORY=/tmp/chroma \
            -e FILE_STORAGE_PATH=/tmp/files \
            legal-ai-backend:ci

          for i in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3).read()" >/dev/null 2>&1; then
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/ready', timeout=5).read()"
              docker logs --tail 80 legal-ai-backend-ci
              docker rm -f legal-ai-backend-ci
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 160 legal-ai-backend-ci
          docker rm -f legal-ai-backend-ci
          exit 1

      - name: Clean smoke database volume
        if: always()
        run: |
          docker rm -f legal-ai-backend-ci >/dev/null 2>&1 || true
          docker volume rm legal-ai-smoke-data >/dev/null 2>&1 || true

      - name: Verify default image contents
        run: |
          docker run --rm legal-ai-backend:ci python -c "import importlib.util, os, shutil; assert shutil.which('curl') is None; assert importlib.util.find_spec('chromadb') is None; assert importlib.util.find_spec('celery') is None; assert importlib.util.find_spec('langchain') is None; assert importlib.util.find_spec('langchain_openai') is None; assert importlib.util.find_spec('paddleocr') is None; assert not os.path.exists('/app/legal_system.db'); assert not os.path.exists('/app/frontend'); assert not os.path.exists('/app/tests'); assert not os.path.exists('/app/exports'); assert not os.path.exists('/app/app/services/data')"

      - name: Build worker image
        run: |
          docker build -f Dockerfile.prod --build-arg INSTALL_WORKER=true -t legal-ai-backend-worker:ci .

      - name: Smoke worker image
        run: |
          docker run --rm legal-ai-backend-worker:ci celery -A app.celery_app report
          docker run --rm legal-ai-backend-worker:ci python -c "import importlib.util; assert importlib.util.find_spec('celery') is not None; assert importlib.util.find_spec('chromadb') is None; assert importlib.util.find_spec('langchain') is None; assert importlib.util.find_spec('langchain_openai') is None; assert importlib.util.find_spec('paddleocr') is None"

  # ============================================================
  # 5. 安全扫描
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety & bandit
        run: |
          pip install safety bandit

      - name: Run safety check
        run: |
          safety check --file=requirements-core.txt --json --output=safety-core.json || true
          safety check --file=requirements-optional.txt --json --output=safety-optional.json || true
          safety check --file=requirements-worker.txt --json --output=safety-worker.json || true

      - name: Run bandit
        run: |
          bandit -r app/ -f json -o bandit_report.json || true
